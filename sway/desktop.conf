set $aoc HDMI-A-1
set $hp_omen DP-3

output DP-1 mode 2560x1440@74.780Hz
output $aoc mode 2560x1440 transform 90 position 0,0
output $hp_omen mode 3440x1440 position 1440,407

workspace 2:slack output $aoc

input "1133:16505:Logitech_G_Pro" {
     accel_profile "flat"
     pointer_accel 1
}

# Same mouse when connected by cable (shows up with a different identifier)
input "1133:49288:Logitech_G_Pro_Wireless_Gaming_Mouse" {
     accel_profile "flat"
     pointer_accel 1
}
