"$schema" = 'https://starship.rs/config-schema.json'

add_newline = false
format = "$hostname$directory$git_branch$git_status "

# Only shown over SSH, as an inverted badge so it can't be missed
[hostname]
ssh_only = true
ssh_symbol = "ssh "
style = "bold black bg:yellow"
format = "[ $ssh_symbol$hostname ]($style) "

[directory]
truncation_length = 1
format = "[$path]($style) "

[git_branch]
format = "[$branch]($style) "

[git_status]
format = "[$all_status$ahead_behind]($style) "
conflicted = "="
ahead = ">"
behind = "<"
diverged = "<>"
up_to_date = ""
untracked = "?"
stashed = '\$'
modified = "!"
staged = "+"
renamed = "»"
deleted = "x"
